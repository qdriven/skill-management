<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>RefDock 设置</title>
<style>
  :root {
    --bg: #f4faf6; --surface: #fff; --ink: #12271b; --ink-2: #4a5d51;
    --ink-3: #7d8f84; --accent: #10b981; --accent-ink: #065f46;
    --accent-soft: #d1fae5; --line: #dcefe4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font: 14px/1.6 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
    max-width: 640px; margin: 0 auto; padding: 40px 24px;
  }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
  .logo {
    width: 36px; height: 36px; border-radius: 9px; background: var(--accent);
    display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 18px;
    box-shadow: 0 2px 6px rgba(16,185,129,.4);
  }
  h1 { font-size: 20px; }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 20px; margin-bottom: 16px;
  }
  h2 { font-size: 13px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin: 12px 0 4px; }
  input {
    width: 100%; font: 13px/1.4 ui-monospace, Consolas, monospace;
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    background: var(--bg); color: var(--ink);
  }
  input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .hint { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
  .row { display: flex; gap: 10px; margin-top: 16px; }
  button {
    font: 600 13px inherit; border-radius: 9px; padding: 9px 18px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.06); }
  #msg { font-size: 13px; margin-left: auto; align-self: center; }
  #msg.ok { color: var(--accent-ink); } #msg.err { color: #dc2626; }
  code { font: 12px ui-monospace, Consolas, monospace; background: var(--accent-soft); border-radius: 5px; padding: 1px 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--ink-3); font-size: 11px; text-transform: uppercase; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td.mono { font: 12px ui-monospace, Consolas, monospace; }
  kbd {
    font: 11px ui-monospace; background: var(--bg); border: 1px solid var(--line);
    border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px;
  }
</style>
</head>
<body>
<header>
  <div class="logo">R</div>
  <h1>RefDock 设置</h1>
</header>

<div class="card">
  <h2>伴侣服务</h2>
  <label for="serverUrl">服务地址</label>
  <input id="serverUrl" placeholder="http://127.0.0.1:7420" />
  <div class="hint">默认 <code>http://127.0.0.1:7420</code>。启动方式见 ref-dock/README.md。</div>

  <label for="token">访问令牌(可选)</label>
  <input id="token" placeholder="服务以 --token 启动时填写" />
</div>

<div class="card">
  <h2>快捷键</h2>
  <table>
    <tr><th>动作</th><th>默认</th></tr>
    <tr><td>打开 RefDock 弹窗</td><td><kbd>Alt+R</kbd> — 可在 <code>chrome://extensions/shortcuts</code> 修改</td></tr>
  </table>
</div>

<div class="card">
  <h2>多 workspace</h2>
  <div class="hint" style="margin:0 0 10px">服务启动参数 <code>--workspace D:\repoA --workspace D:\repoB</code> 即可注册多个目标仓,弹窗左上角下拉切换。</div>
  <table id="wsTable"><thead><tr><th>ID</th><th>名称</th><th>路径</th></tr></thead><tbody></tbody></table>
</div>

<div class="row">
  <button class="primary" id="save">保存</button>
  <button id="test">测试连接</button>
  <span id="msg"></span>
</div>

<script src="options.js"></script>
</body>
</html>
